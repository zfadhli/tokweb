<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">tokweb — self-hosted TikTok Live recorder</title>
  <desc id="hero-desc">The tokweb wordmark and its promise: add a creator once and every live session lands in your own archive as a browser-playable MP4. On the right, two real capture cards from the archive and a recorded file name.</desc>

  <rect width="1200" height="380" rx="26" fill="#08090b"/>

  <g id="title-block" transform="translate(56 0)">
    <circle cx="7" cy="60" r="6" fill="#c8f24f"/>
    <text x="24" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1.6" fill="#c8f24f">SELF-HOSTED TIKTOK LIVE RECORDER</text>

    <text x="0" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="600" letter-spacing="-1.5" fill="#e8e6e1">tokweb</text>

    <text x="0" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#a3aab5">Add a creator once. Every live session lands</text>
    <text x="0" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#a3aab5">in your archive as a browser-playable MP4,</text>
    <text x="0" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" fill="#a3aab5">ready to stream, download or delete.</text>

    <text x="0" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b94a2">Bun 1.4 · Elysia · ffmpeg · one JSON journal · MIT</text>
  </g>

  <g id="archive-proof" transform="translate(660 34)">
    <text x="0" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1.6" fill="#8b94a2">LATEST CAPTURES</text>

    <g id="card-northlight" transform="translate(0 34)">
      <rect width="236" height="232" rx="4" fill="#12161d" stroke="#20262f"/>
      <rect width="236" height="140" rx="4" fill="#171c24"/>
      <text x="118" y="88" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="46" fill="#e8e6e1" fill-opacity="0.22">NO</text>
      <rect x="10" y="110" width="62" height="21" rx="2" fill="#08090b" fill-opacity="0.72"/>
      <text x="18" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#a3aab5">03:00</text>
      <text x="12" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#e8e6e1">@northlight</text>
      <text x="12" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8b94a2">greenhouse build</text>
      <text x="12" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8b94a2">23 Oct · 648.2 KB</text>
    </g>

    <g id="card-aurorabeats" transform="translate(248 34)">
      <rect width="236" height="232" rx="4" fill="#12161d" stroke="#20262f"/>
      <rect width="236" height="140" rx="4" fill="#171c24"/>
      <text x="118" y="88" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="46" fill="#e8e6e1" fill-opacity="0.22">AU</text>
      <rect x="10" y="110" width="62" height="21" rx="2" fill="#08090b" fill-opacity="0.72"/>
      <text x="18" y="124" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#a3aab5">03:00</text>
      <text x="12" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#e8e6e1">@aurorabeats</text>
      <text x="12" y="202" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#8b94a2">analog synths, live</text>
      <text x="12" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8b94a2">23 Oct · 648.2 KB</text>
    </g>

    <text x="0" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b94a2">northlight_20261023_194302.mp4</text>
  </g>
